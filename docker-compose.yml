version: '3.8'

services:
  web:
    build: .
    container_name: quant_web_api
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - MARKET_HOURS_CHECK=on
      - ALLOW_VERSION_MISMATCH=1
    volumes:
      - ./paper_trades.db:/app/paper_trades.db
      - ./reports:/app/reports
      - ./inbox:/app/inbox
      - ./outbox:/app/outbox
      - ./models:/app/models
    restart: unless-stopped
    command: python app.py

  paper-trader:
    build: .
    container_name: quant_paper_trader
    depends_on:
      - web
    environment:
      - MARKET_HOURS_CHECK=on
      - ALLOW_VERSION_MISMATCH=1
    volumes:
      - ./paper_trades.db:/app/paper_trades.db
      - ./reports:/app/reports
      - ./models:/app/models
    restart: unless-stopped
    command: python auto_trader.py
